<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14263d">
  <title>Animal Books AR</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <div id="ar-view" aria-label="Kamera AR"></div>
    <div class="overlay">
      <p id="mode" hidden></p>
      <section class="panel" aria-label="Petunjuk dan kontrol">
        <p id="status" role="status" aria-live="polite">Memuat aplikasi…</p>
        <p id="instruction">Ketuk untuk suara ? Geser untuk putar.</p>
        <p id="audio-status" role="status" aria-live="polite"></p>
        <div id="animal-buttons" aria-label="Pilihan hewan untuk pratinjau"></div>
        <div class="actions"><button id="start-ar" hidden disabled>Coba kamera lagi</button><button id="preview" hidden>Kembali ke pratinjau</button></div>
        <details id="asset-details" hidden><summary id="asset-summary">Status aset</summary><ul id="asset-list"></ul></details>
        <noscript>Aktifkan JavaScript agar aplikasi dapat berjalan.</noscript>
      </section>
    </div>
  </main>
</body>
</html>
